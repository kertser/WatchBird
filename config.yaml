# Bioguard Configuration File

camera:
  backend: picamera2  # or video_file
  resolution: [1280, 720]  # 720p HD - widely supported (was 800x600, unsupported by most USB cameras)
  fps: 30
  video_path: null  # for video_file backend

detection:
  face_conf_threshold: 0.7

tracking:
  max_age: 30  # frames
  min_hits: 3 # frames
  iou_threshold: 0.3 # Intersection over Union threshold

quality:
  min_face_quality: 0.3    # Runtime: filter low-quality faces
  min_enroll_quality: 0.7  # Enrollment: stricter quality for enrolled photos
  min_bbox_size: 40  # pixels (minimum face bounding box size)
  blur_threshold: 100.0  # Laplacian variance = blur measure (threshold lowered for faster recognition)

fusion:
  window_size: 15  # M frames (
  consistency_count: 5  # N frames
  embedding_sample_interval: 3  # Extract embeddings every N frames (3 = ~6.7 fps at 20fps camera)
  confidence_decay_threshold: 10  # Number of inconsistent frames before dropping FRIENDLY status (increased for stability)

thresholds:
  t_accept: 0.65  # Minimum score for FRIENDLY (kept at 0.5 since scores are 0.6+)
  t_margin: 0.03  # Minimum margin (reduced from 0.07 - likely the main issue!)
  t_timeout: 10.0  # seconds (increased from 8.0 to give even more time)

index:
  face_index_path: data/index/face.index
  meta_path: data/index/meta.jsonl

models:
  face_detector: models/yunet.onnx
  #face_embedder: models/mobilefacenet.onnx
  face_embedder: models/arcface_r100.onnx

stream:
  enabled: true
  host: 0.0.0.0
  port: 8080

inference:
  use_gpu: true  # Enable GPU acceleration if available (CUDA/DirectML)
  gpu_device_id: 0  # GPU device ID to use

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
