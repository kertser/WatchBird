camera:
  backend: usb
  resolution:
  - 640
  - 480
  fps: 30
  video_path: null
detection:
  face_conf_threshold: 0.7
tracking:
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3
quality:
  min_face_quality: 0.3
  min_enroll_quality: 0.8
  min_bbox_size: 40
  blur_threshold: 100.0
fusion:
  window_size: 30
  consistency_count: 15
  embedding_sample_interval: 3
  confidence_decay_threshold: 25
  embedding_window: 15
  embedding_min: 8
thresholds:
  t_accept: 0.78
  t_margin: 0.20
  t_timeout: 15.0
  identity_switch_margin: 0.25
index:
  face_index_path: data/index/face.index
  meta_path: data/index/meta.jsonl
plda:
  enabled: true
  model_path: data/index/plda.npz
  faiss_k: 5
  llr_threshold: 2.5
  margin_threshold: 0.5
  calibrate: true
models:
  face_detector: models/yunet.onnx
  face_embedder: models/mobilefacenet.onnx
stream:
  enabled: true
  host: 0.0.0.0
  port: 8080
inference:
  use_gpu: true
  gpu_device_id: 0
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
